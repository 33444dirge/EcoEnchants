# Table chance is the chance of getting enchantment as a percentage from an enchanting table
# Minimum Level is the minimum xp level you have to be to get the enchantment
# You can add more rarities by following the pattern.
# Remember, enchantments are more likely to be high-level the closer they are to maximum-obtainable-level
# Villager chance is the chance of a villager having this trade as a percentage. Vanilla default for all enchantments is 2.7%, however you can choose this per-rarity.
# Loot chance is the chance of an item in a loot chest having this enchantment as a percentage
#
# format：该品质的显示颜色。配置了本项后，附魔名按「品质」着色（aiyatsbus 风格）；
#         留空则回退到 types.yml 中该附魔类型的 format（原版行为）。
#
# ─── 选取机制已改为 aiyatsbus 的加权抽选 ─────────────────────────────
#
# 附魔台 / 村民 / 战利品的选取分两段：
#   1. 在候选池出现过的品质之间，按下面的 weight 抽出一个品质；
#   2. 在该品质的附魔之间，按各附魔配置里的 weight（默认 1）抽出一个。
#
# 附魔台悬停候选遵循 Aiyatsbus 的实现，品质权重会乘以该品质的候选数量；
# 实际附魔时的额外词条、村民与战利品则每个品质只计算一次 weight。
#
# weight 取自当前 aiyatsbus：普通 1000 / 罕见 500 / 精良 250 / 史诗 50 /
#                              传奇 10 / 稀世 5 / 诅咒 25 / 皮肤 1
#
# table-chance / villager-chance / loot-chance 仅作为旧配置的来源开关回退值；
# Aiyatsbus 模式的实际品质概率由 weight 决定，词条数量由 config.yml 控制。
#
# from-table / from-villager / from-loot：该品质能否从对应来源获得，
#   对应 aiyatsbus 的 accessibleFromTable / Villager / Loot。
#   未配置时按对应来源的 chance 是否大于 0 推断。
#
# minimum-level 为旧配置兼容字段，Aiyatsbus 模式不使用该等级门槛。

