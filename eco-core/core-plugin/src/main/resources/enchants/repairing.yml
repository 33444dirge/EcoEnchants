# 对应 aiyatsbus / Nereus-Opus 的「自生」。
# 该附魔作用于背包内非手持物品，无法做成 libreforge effect，
# 因此沿用 EcoEnchants 的硬编码实现（EnchantmentRepairing），FXEnchant 不迁移它。
display-name: "自生"
description: "处于非手持状态时耐久度持续增加"
type: normal
placeholders:
  frequency: "5"
  amount: "%level%"

targets:
  - all
# 源实现与「腐烂诅咒」互斥（一个加耐久、一个掉耐久）
conflicts:
  - decay_curse
rarity: unknown
max-level: 3

tradeable: true
discoverable: true
enchantable: true

conditions: [ ]

repair-per-level: 1 # 每级每次恢复的耐久点数
frequency: 100 # 恢复间隔（tick，不支持 %level%）。对应源配置的 repeat-ticks: 100
not-while-holding: true # 手持/穿戴时不恢复，对应源描述的「处于非手持状态时」
