#
# EcoEnchants
# by Auxilor
#

# Options for enchanting items in the enchanting table
enchanting-table:
  enabled: true # If custom enchantments should be available from enchanting tables
  # Aiyatsbus: each successful roll unlocks the next extra enchantment.
  more-enchant-chances: [0.2, 0.15, 0.1]
  max-level-limit: 5
  full-level-permission: "aiyatsbus.privilege.table.full"
  vip-permission: "aiyatsbus.privilege.table.vip"
  vip-chance-multiplier: 1.2
  svip-permission: "aiyatsbus.privilege.table.svip"
  svip-chance-multiplier: 1.4

# Options for obtaining custom enchants from villagers
villager:
  enabled: true # If custom enchantments should be available from villagers
  amount: 1
  max-level-limit: -1

# Options for obtaining custom enchants in natural loot
loot:
  enabled: false
  fish-enabled: false
  vanilla-mode: false
  cost: 3
  bonus: 16
  more-enchant-chances: [0.2, 0.15, 0.1]
  max-level-limit: -1
  full-level-permission: "aiyatsbus.privilege.loot.full"
  vip-permission: "aiyatsbus.privilege.loot.vip"
  vip-chance-multiplier: 1.2
  svip-permission: "aiyatsbus.privilege.loot.svip"
  svip-chance-multiplier: 1.4

# Options for merging items in an anvil
anvil:
  # Values and formulas migrated from the active Aiyatsbus anvil.yml.
  enchant-limit: 8
  book-enchant-limit: 32
  allow-unsafe-level: false
  block-on-unsafe-level: true
  allow-unsafe-combine: false
  use-rework-penalty: true
  max-repair-cost: 50
  rename-cost: 1
  repair-cost: 5
  combine-repair-cost: 2
  new-enchant-extra-cost: 2
  enchant-cost-per-level: 6.0
  vip-permission: "aiyatsbus.privilege.anvil.vip"
  vip-discount: 1
  svip-permission: "aiyatsbus.privilege.anvil.svip"
  svip-discount: 2

# Aiyatsbus grindstone refund rules.
grindstone:
  enabled: true
  base-experience: 30.0
  accumulation: true
  default-rarity-bonus: 1.0
  rarity-bonus:
    uncommon: 1.25
    rare: 1.5
    epic: 2.0
    legendary: 4.0
    unknown: 8.0
  vip-permission: "aiyatsbus.privilege.grindstone.vip"
  vip-multiplier: 1.25
  svip-permission: "aiyatsbus.privilege.grindstone.svip"
  svip-multiplier: 1.5

# Options for how enchantments are displayed on items
display:
  # If you disable display, enchantments will not show up on items. Only disable if you are handling display elsewhere.
  # Changing this will require a server restart.
  enabled: true
  # If enchantments should be displayed on the bottom of the item's lore
  enchantments-below-lore: false

  numerals:
    enabled: true # If numerals should be used for the enchantment levels
    threshold: 10 # Above this, numbers will be used instead of numerals

  # Options for not met lines: https://hub.auxilor.io/wiki/libreforge/configuring-a-condition#example-condition-config
  not-met:
    format: "<strikethrough>" # Enchantments with any not-met-lines active will have this format added to them

  above-max-level:
    enabled: true # If enchantments above their max level should have a custom format
    format: "<gradient:#1D976C:#93F9B9>" # The format to apply
    level-only: true # If only the level should be formatted

  sort:
    # Aiyatsbus item-lore runtime behavior: sort enchantments by level ascending.
    # Missing this option also defaults to true for existing configurations.
    level: true

    type: false # If enchantments should be sorted by time
    type-order: # The order for types to be sorted in. Types not in this list will not be displayed if type sorting is enabled.
      - normal
      - special
      - curse

    length: false # If enchantments should be sorted by length

    rarity: false # If enchantments should be sorted by rarity
    rarity-order: # The order for rarities to be sorted in. Rarities not in this list will not be displayed if rarity sorting is enabled.
      - common
      - uncommon
      - rare
      - epic
      - legendary
      - unknown
      - curse
      - artifact
      - special
      - veryspecial

  collapse:
    enabled: true # If enchantments should be collapsed in lore
    # 超过此数量才合并显示。设为 0 表示「始终」每行放 per-line 个（aiyatsbus 风格）。
    # 想还原原版「附魔多了才合并」的行为，改回 9 即可。
    threshold: 0
    per-line: 2 # The amount of enchantments to put in each line
    delimiter: "&7, " # The delimiter between enchantments

  descriptions:
    enabled: true # If enchantment descriptions should be shown in lore
    # 合并显示时描述依然会显示（对齐 aiyatsbus 的 combine.layout 行为）。
    # 超过此数量则不再显示描述，避免 lore 过长。
    threshold: 8
    word-wrap: 27 # Number of characters to have on each line
    # 对齐 aiyatsbus 的 "&8| &7{description}"：深灰竖线 + 灰色正文
    # 原为 "&8"（整条深灰），偏暗
    format: "&8| &7"

  # 剩余附魔词条数（对应 aiyatsbus 的 capability_line）。
  # 仅在物品所属目标配置了 targets.yml 的 max-enchants、且物品已有附魔时显示。
  # 可用占位符：%capacity% 剩余、%used% 已用、%max% 上限
  capacity:
    enabled: true
    format: "&c| &7附魔词条数空余: &e%capacity%"

  # 附魔块与物品原有 lore 之间的分隔行（对应 aiyatsbus lore_formation 里的 "&r "）。
  # 留空则不插入。物品本身没有 lore 时不会插入，避免尾部多出空行。
  separator: "&r "

  require-enchantable: true # If EcoEnchants should not display on non-enchantable items.

# Options for the /enchantinfo GUI
enchantinfo:
  rows: 3 # How many rows for the GUI
  mask: # The background material
    items:
      - black_stained_glass_pane
    pattern: # 1 for the first item, 2 for the second item, etc
      - "111111111"
      - "111101111"
      - "111111111"
  item:
    row: 2
    column: 5
    show-max-level: true # Whether the book should be the max level or level 1
    lore: # The description is automatically appended
      - ""
      - "&f最高等级: &a%max_level%"
      - "&f品质: &a%rarity%"
      - "&f适用于: &a%targets%"
      - "&f冲突附魔: &a%conflicts%"
      - "&f前置附魔: &a%required%"

  # Custom GUI slots; see here for a how-to: https://hub.auxilor.io/wiki/eco/pages#custom-gui-slots
  custom-slots: [ ]

# Options for the enchant GUI.
enchant-gui:
  rows: 6 # How many rows to have in the GUI
  title: "附魔一览 &7(%page%/%max_page%)" # The title of the GUI

  mask: # The background material
    items:
      - black_stained_glass_pane
    pattern: # 1 for the first item, 2 for the second item, etc
      - "111101111"
      - "111111111"
      - "100000001"
      - "100000001"
      - "100000001"
      - "111111111"

  # Empty item to show when there is no enchanted book
  empty-item: gray_stained_glass_pane name:""

  # Options for the info item
  info:
    item: player_head name:"&a这个怎么用？" texture:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjcwNWZkOTRhMGM0MzE5MjdmYjRlNjM5YjBmY2ZiNDk3MTdlNDEyMjg1YTAyYjQzOWUwMTEyZGEyMmIyZTJlYyJ9fX0=
    lore:
      - "&f把物品放进上方的槽位，"
      - "&f该物品可以附加的所有附魔"
      - "&f都会显示在下方区域中！"
      - ""
    row: 1
    column: 9

  item-row: 1 # The row for the slot to drop in the item
  item-column: 5 # The column

  # Options for the page change buttons
  page-change:
    # The sound played when the page is changed
    sound:
      enabled: true
      sound: ui.button.click
      pitch: 1.0
      volume: 1.0
    forwards:
      item: arrow name:"&f下一页" # The item. Will not show if on the last page.
      item-inactive: gray_dye name:"&7下一页" # The item shown on the last page
      row: 6
      column: 6
    backwards:
      item: arrow name:"&f上一页" # The item. Will not show if on the first page.
      item-inactive: gray_dye name:"&7上一页" # The item shown on the first page
      row: 6
      column: 4

  # Optional close button for the enchant GUI
  close-button:
    enabled: true
    item: barrier
    name: "&c关闭"
    lore: [ ]
    row: 6
    column: 5

  # Options for the area where the enchantments are shown
  enchant-area:
    width: 7 # The width of the enchantment area
    height: 3 # The height of the enchantment area
    row: 3 # The row of the top-left corner of the area
    column: 2 # The column of the top-left corner of the area

  # Custom GUI slots; see here for a how-to: https://hub.auxilor.io/wiki/eco/pages#custom-gui-slots
  custom-slots: [ ]

  # If enabled, /enchant opens a group selection menu first, grouping enchantments
  # by the group-by setting. If disabled, /enchant opens the flat enchantment list (current behavior).
  grouped: false

  # What to group enchantments by. Only used when grouped is true.
  # Options: type (from types.yml), rarity (from rarity.yml), target (from targets.yml)
  group-by: type

  # Back button to return from a filtered sub-menu to the group selection menu.
  # Only shown when grouped is true.
  back-button:
    enabled: true
    item: arrow name:"&f返回分类"
    lore: []
    row: 6
    column: 1

# Options for the group selection GUI (only used when enchant-gui.grouped is true)
group-gui:
  rows: 3
  title: "附魔分类"

  mask:
    items:
      - black_stained_glass_pane
    pattern:
      - "111111111"
      - "100000001"
      - "111111111"

  # Each group must have a unique id matching an entry from the file corresponding
  # to the group-by setting:
  #   group-by: type   -> IDs from types.yml   (normal, spell, special, curse)
  #   group-by: rarity -> IDs from rarity.yml  (common, uncommon, rare, epic, legendary, special, veryspecial)
  #   group-by: target -> IDs from targets.yml (sword, pickaxe, helmet, bow, etc.)
  # Groups with unrecognized IDs are silently ignored.
  groups:
    - id: normal
      item: enchanted_book name:"&7普通附魔"
      lore:
        - "&f点击浏览普通附魔"
      row: 2
      column: 2
    - id: spell
      item: enchanted_book name:"<gradient:#0575E6:#1E3FBA>技能附魔"
      lore:
        - "&f点击浏览技能附魔"
      row: 2
      column: 4
    - id: special
      item: enchanted_book name:"<gradient:#FB57EC:#EF1DEC>特殊附魔"
      lore:
        - "&f点击浏览特殊附魔"
      row: 2
      column: 6
    - id: curse
      item: enchanted_book name:"&c诅咒附魔"
      lore:
        - "&f点击浏览诅咒附魔"
      row: 2
      column: 8

  # Custom GUI slots; see here for a how-to: https://hub.auxilor.io/wiki/eco/pages#custom-gui-slots
  custom-slots: []

# Options for converting lore-based enchants (from other plugins) with EcoEnchants enchantments
# with the same names. If you're switching over from another plugin and don't want your players to
# lose their enchantments, just switch this on.
lore-conversion:
  enabled: false # If lore conversion should be enabled
  aggressive: false # Will convert all items in all inventories when opened, likely to use a lot of performance
