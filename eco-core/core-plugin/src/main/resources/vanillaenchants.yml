# Rarity option does not affect vanilla enchantments.
# The option is there for the display option to sort by rarity.

protection:
  name: "保护"
  description: "&7减少&a%placeholder%%&7伤害 (总上限&a20级&7)"
  placeholder: "%level% * 4"
  type: normal
  rarity: rare
  #max-level: 6 # Custom max level to override for the enchantment. Raise it, but lowering it may cause bugs.
  #conflicts: [] # Custom conflicts to override for the enchantment. Add or remove conflicts as you please.

fire_protection:
  name: "火焰保护"
  description: "&7减少&a%damage%%&7火焰伤害 (总上限&a10级&7)"
  placeholders:
    damage: "%level% * 8"
    time: "%level% * 15"
  type: normal
  rarity: uncommon

feather_falling:
  name: "摔落保护"
  description: "&7减少&a%placeholder%%&7摔落伤害 (总上限&a10级&7)"
  placeholder: "%level% * 8"
  type: normal
  rarity: uncommon

blast_protection:
  name: "爆炸保护"
  description: "&7减少&a%damage%%&7爆炸伤害 (总上限&a10级&7)"
  placeholders:
    damage: "%level% * 8"
    knockback: "%level% * 15"
  type: normal
  rarity: common

projectile_protection:
  name: "弹射物保护"
  description: "&7减少&a%placeholder%%&7弹射物伤害 (总上限&a10级&7)"
  placeholder: "%level% * 8"
  type: normal
  rarity: common

respiration:
  name: "水下呼吸"
  description: "&7每次消耗氧气值时有&a%chance%%&7不消耗氧气或受到窒息伤害"
  placeholders:
    seconds: "15 * %level%"
    chance: "100 * %level% / (%level% + 1)"
  type: normal
  rarity: uncommon

aqua_affinity:
  name: "水下速掘"
  description: "无视水下的挖掘速度降低效果"
  type: normal
  rarity: uncommon

thorns:
