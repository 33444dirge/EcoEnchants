  description: "&7使击中的生物燃烧&a%placeholder%秒"
  placeholder: "4 * %level%"
  type: normal
  rarity: rare

looting:
  name: "抢夺"
  description: "&7使大部分常见掉落物的数量上限提高&a%common%个&7，使稀有掉落物的掉落概率提高&a%rare%%"
  placeholders:
    common: "%level%"
    rare: "%level%"
  type: normal
  rarity: epic

