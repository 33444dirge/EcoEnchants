    damage: "2.5 * %level%"
    seconds: "1 + 0.5 * %level%"
  type: normal
  rarity: common

knockback:
  name: "击退"
  description: "&7使横向击退距离增加&a%placeholder%格"
  placeholder: "2.6 * (%level% - 1) + 1.6"
