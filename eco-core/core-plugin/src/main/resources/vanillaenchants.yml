  description: "&7受到攻击时有&a%placeholder%%&7对攻击者造成&a1~5点&7的伤害，并消耗&a2点&7耐久度"
  placeholder: "%level% * 15"
  type: normal
  rarity: rare

depth_strider:
  name: "深海探索者"
  description: "&7无视&a%placeholder%%&7在水中受到的减速效果"
  placeholder: "round(100 * %level% / 3)"
  type: normal
  rarity: rare

frost_walker:
  name: "冰霜行者"
  description: "&7在地面上时使&a%placeholder%格&7内的水结冰"
  placeholder: "%level% + 2"
  type: normal
  rarity: rare

binding_curse:
  name: "绑定诅咒"
  description: "被诅咒的物品穿在身上后无法卸下"
  type: curse
  rarity: curse

sharpness:
  name: "锋利"
  description: "&7近战攻击伤害提高&a%placeholder%点"
  placeholder: "0.5 * %level% + 0.5"
  type: normal
  rarity: uncommon

smite:
  name: "亡灵杀手"
  description: "&7对亡灵生物的基础伤害提高&a%placeholder%点"
  placeholder: "2.5 * %level%"
  type: normal
  rarity: common

bane_of_arthropods:
  name: "节肢杀手"
  description: "&7对节肢动物的基础伤害提高&a%damage%点&7，并对其施加&a1~%seconds%秒&7的缓慢IV效果"
